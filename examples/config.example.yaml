## Optional documentation of the prompt's built-in defaults.
## The copy-ready prompt does not read this file automatically.
schema_version: 2

routing:
  enabled: true
  assume_all_accounts_eligible: true
  require_browser_capability: true
  local_only_when_browser_unavailable: true
  split_mixed_tasks: true
  prevent_duplicate_execution: true

monitoring:
  silent: true
  sparse: true
  max_explicit_retries: 1
  queued_is_failure: false

privacy:
  public_context_only: true
  minimize_payload: true
  redact_before_handoff: true
  prohibit_credentials: true
  prohibit_session_data: true
  prohibit_personal_data: true
  prohibit_unpublished_material: true
  prohibit_complete_private_code: true

confirmation_required_for:
  - sign_in
  - switch_account
  - verification_challenge
  - paid_action
  - subscription_change
  - private_file_upload
  - public_publish
